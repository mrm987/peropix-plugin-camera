<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카메라 구도</title>
<!--
  PeroPix 공식 플러그인 「카메라 구도」 — docs/camera-view-mockup.html (2026-08-11) 을 옮긴 것.
  카메라 위치를 고르는 게 아니라 **보이는 모습**을 보면서 옮긴다. 설 수 있는 자리는 실측으로 확정한 것뿐이다
  (방위 16 · 높이 12 · 거리 11).
  ★★**작은 앱의 본보기다** (사용자 지시 2026-09-10: *"박스 자체가 앱인 느낌"*). 앱이 주는 공통 자산 두 줄만 쓰고,
    창 골격은 `header`(도구줄) · `main`(본문) · `footer`(상태줄) 로 짠다 — 창을 키우면 **그림판만** 커진다.
  ★그림판은 늘어나는 것이 아니라 **그 크기로 다시 그린다** (`fit()`): 어떤 크기에서도 선이 또렷하다.

  ★★2026-09-11: **기본은 캡슐 마네킹이고, 단추를 누르면 입체 모델로 바뀐다** (사용자 지시).
    · 마네킹은 2D 캔버스(`hud`)에 직접 그린다 — 앞뒤를 **색**으로 갈라 칠하므로 방위가 한눈에 들어오고,
      사람 비율(키 1.8) 그대로라 거리 표(`FRAME`)를 옮길 필요가 없다 (`toModel()` 은 입체 모델 전용이다).
    · 입체 모델은 **누를 때 비로소 받는다** (`ensureModel()`) — 4MB 짜리 GLB 를 안 쓰는 회차까지 받지 않게.
    · 두 그림은 같은 상태(방위·높이·거리)를 보므로, 어느 쪽으로 보든 만들어지는 태그는 똑같다.

  ★2026-09-10: 입체 모델을 들였을 때의 기록.
    · 모델 `model/character.glb` — 사용자가 Blender 로 만든 3등신 데포르메 경찰 캐릭터.
      리깅·애니메이션 없음, +Y 위 · +Z 정면 · 미터 단위, 키 1.4655 (발 0.0025 ~ 경찰모 1.468).
    · three.js r180 (MIT, `lib/three-LICENSE.txt`) 를 함께 담았다 — 인터넷 없이 떠야 하므로 CDN 을 쓰지 않는다.
      `lib/` 안의 배치(`three.module.min.js` + `three.core.min.js` · `loaders/` · `utils/`)는 배포본 그대로다 —
      그 파일들이 서로를 상대 경로로 부르므로 옮기면 깨진다. 이름표 `three` 는 문서 머리의 importmap 이 이어 준다.
    · 앞·뒤를 색으로 갈라 칠하던 것을 걷었다. 얼굴·꼬리·모자가 있으니 방향은 모습으로 안다.
    · ★거리 표(`FRAME`)는 **사람 비율(발 0 · 머리끝 1.795) 그대로 둔다.** 그 값들은 생성 결과로 맞춘 것이라
      정본이고, 대신 그릴 때 `toModel()` 이 **같은 부위끼리** 옮겨 준다 (아래 `MARK` 표). 그래서 3등신 모델에서도
      「얼굴」은 얼굴이, 「허벅지」는 허벅지가 화면에 담긴다. 모델을 바꾸면 `MARK` 만 다시 재면 된다.
-->
<link rel="stylesheet" href="/plug/_app/base.css">
<script src="/plug/_app/peropix.js"></script>
<script src="i18n.js"></script>
<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }
</script>
<style>
  /* 그림판 안의 색은 앱 토큰이 아니라 **이 그림의 팔레트**다 — 3D 뷰포트처럼 테마와 무관하게 어둡다 */
  /* ★그림판 **밖**의 글자는 테마를 따라간다 (사용자 지적 2026-09-11: 밝은 테마에서 금색이 배경에 묻힌다).
     `base.css` 와 같은 방식으로 `prefers-color-scheme` 을 본다 — 앱이 프레임의 color-scheme 을 바꿔 주므로 따라온다. */
  :root { --gold: #8a5a00; }                                  /* 밝은 테마 — 흰 바탕에서 읽히는 진한 호박색 */
  @media (prefers-color-scheme: dark) { :root { --gold: #ffd76b; } }
  main { gap: var(--sp-4); }
  /* 그림판 — 남는 자리를 채우되 비율을 지킨다 (`.stage` 가 가운데 정렬) */
  /* 크기는 `fit()` 이 px 로 정한다 — 남는 자리에 들어가는 가장 큰 720:520 상자 */
  #view { position: relative; border-radius: var(--r-3); overflow: hidden; background: #10141a; cursor: grab; touch-action: none; user-select: none; }
  #view:active { cursor: grabbing; }
  #cv, #hud { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  #out { margin: 0; color: #fff2a6; background: #10141a; }
  .stat b { color: var(--gold); font-weight: var(--w-semi); }
  /* 마네킹의 앞·뒤 색을 알려 주는 자리 — 입체 모델에서는 숨는다 */
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; }
  .mulrow input { width: 78px; color: var(--gold); font-family: var(--font-mono); }
  #note { min-height: 16px; }
</style>
</head>
<body>
<header>
  <button class="primary" id="btnPut" data-put data-t="지금 씬에 넣기">지금 씬에 넣기</button>
  <button id="btnCopy" data-copy data-t="복사">복사</button>
  <button id="btnMode" data-mode></button>
  <span class="muted spacer" id="hint"></span>
</header>

<main>
  <div class="stage"><div id="view"><canvas id="cv"></canvas><canvas id="hud"></canvas></div></div>
  <div class="row stat">
    <span><span data-t="방위">방위</span> <b id="vAz"></b> · <span data-t="높이">높이</span> <b id="vEl"></b> · <span data-t="거리">거리</span> <b id="vDist"></b></span>
    <span class="muted spacer" id="legend" style="text-align:right">
      <i class="sw" style="background:#7fb9f0"></i> <span data-t="앞">앞</span>
      &nbsp;<i class="sw" style="background:#d98a5c"></i> <span data-t="뒤">뒤</span>
    </span>
  </div>
  <pre id="out"></pre>
  <div class="row mulrow">
    <label for="mulN" data-t="배율">배율</label>
    <input type="number" id="mulN" min="0.1" max="5" step="0.1" value="1.0">
    <span class="muted" data-t="모든 가중치에 곱합니다. 실측 최적 1.0 · 2.5 부근부터 그림이 무너집니다.">모든 가중치에 곱합니다. 실측 최적 1.0 · 2.5 부근부터 그림이 무너집니다.</span>
  </div>
  <div class="muted" id="note"></div>
</main>

<footer><b data-t="드래그">드래그</b> <span data-t="둘러보기">둘러보기</span> · <b data-t="휠">휠</b> <span data-t="거리">거리</span> · <b>&larr; &rarr;</b> <span data-t="방위">방위</span> · <b>&uarr; &darr;</b> <span data-t="높이">높이</span> · <b>Home</b> <span data-t="정면으로">정면으로</span></footer>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./lib/loaders/GLTFLoader.js";

// 앱 창구는 `/plug/_app/peropix.js` 가 준다 — `peropix.action` · `toast` · `inApp`
const inApp = peropix.inApp;

// ── 실측 표 ────────────────────────────────────────────────────────────────
const EL = [
  { i:  6, y: 1.000, tag:"directly above, from above", w:1.50, kr:"바로 위" },
  { i:  5, y: 0.875, tag:"directly above, from above", w:1.31, kr:"거의 위" },
  { i:  4, y: 0.750, tag:"directly above, from above", w:1.13, kr:"직부감" },
  { i:  3, y: 0.650, tag:"high angle, from above",     w:0.98, kr:"강한 부감" },
  { i:  2, y: 0.450, tag:"high angle, from above",     w:0.68, kr:"부감" },
  { i:  1, y: 0.250, tag:"high angle, from above",     w:0.38, kr:"약한 부감" },
  { i:  0, y: 0.000, tag:"",                           w:0,    kr:"수평" },
  { i: -1, y:-0.350, tag:"low angle, from below",      w:0.53, kr:"약한 앙각" },
  { i: -2, y:-0.650, tag:"low angle, from below",      w:0.98, kr:"앙각" },
  { i: -3, y:-0.750, tag:"directly below",             w:1.13, kr:"강한 앙각" },
  { i: -4, y:-0.875, tag:"directly below",             w:1.31, kr:"거의 아래" },
  { i: -5, y:-1.000, tag:"directly below",             w:1.50, kr:"바로 아래" },
];

const RUNG = ["portrait","upper body","cowboy shot","full body","wide shot","very wide shot"];
const RUNG_KR = ["얼굴","상반신","허벅지","전신","원경","광각"];
// 칸마다 화면에 담을 몸의 범위 — { 중심 높이, 담을 높이 } (발 0, 머리끝 1.8 기준)
const FRAME = [ {c:1.62,h:0.46}, {c:1.30,h:1.06}, {c:1.06,h:1.56},
                {c:0.92,h:2.08}, {c:0.92,h:3.40}, {c:0.92,h:6.00} ];
const DIST = [];
for (let k = 0; k < RUNG.length; k++) {
  DIST.push({ tags:[RUNG[k]], rungs:[k], f:FRAME[k], mix:false });
  if (k < RUNG.length-1) DIST.push({
    tags:[RUNG[k],RUNG[k+1]], rungs:[k,k+1], mix:true,
    f:{ c:(FRAME[k].c+FRAME[k+1].c)/2, h:(FRAME[k].h+FRAME[k+1].h)/2 } });
}

/** 거리 칸의 이름표 — 지금 언어로. 섞인 칸은 두 이름을 붙인다 */
const distName = (d) => d.rungs.map(i=>T(RUNG_KR[i])).join("+");
const DIR = { front:"from front", back:"from behind", left:"from right", right:"from left" };
const DEADZONE = 0.2;
// ★순수 측면(x = ±0.5)만 총량이 3.0 이다. 2.0 으로는 `full body` 의 정면 편향에 밀려
//   5장 모두 3/4 에서 멈췄고, 3.0 에서 4/5 가 완전한 옆모습이 됐다 (실측 side5.jpg).
//   `profile` 을 얹는 쪽이 5/5 였지만 그 태그는 **좌우를 무작위로 바꿔** 방위축을 깬다.
const azTotal = (x) => (Math.abs(Math.abs(x) - 0.5) < 1e-6 ? 3.0 : 2.0);
function azTags(x){
  const a = x*Math.PI, total = azTotal(x);
  const r = { front:Math.max(0,Math.cos(a)), back:Math.max(0,-Math.cos(a)),
              right:Math.max(0,Math.sin(a)), left:Math.max(0,-Math.sin(a)) };
  const s = Object.values(r).reduce((p,v)=>p+v,0);
  if (s) for (const k in r) r[k] /= s;
  return ["front","back","left","right"]
    .filter((n)=> r[n] > 0 && r[n]*total >= DEADZONE)
    .map((n)=> ({ tag:DIR[n], w:r[n]*total }));
}

// ── 사람 비율 ↔ 이 모델의 같은 부위 ────────────────────────────────────────
/* ★거리 표(`FRAME`)는 **키 1.8 의 사람**을 담는 값이고 바꾸지 않는다 (생성 결과로 맞춘 정본).
   이 모델은 3등신이라 같은 숫자를 그대로 쓰면 「얼굴」에서 입이 잘린다 — 그래서 화면에 담을 위아래 끝을
   **부위끼리 짝지어** 옮긴다. 모델 값은 GLB 의 노드별 경계 상자를 실제로 재서 얻었다 (2026-09-10). */
const MARK = [
  [0.000, 0.0000],   // 발바닥
  [0.500, 0.2300],   // 무릎 — 모델에 무릎 마디가 없어 다리(0.00~0.476)의 절반쯤으로 잡았다
  [0.900, 0.4500],   // 사타구니 (속바지 아래단 0.427)
  [1.050, 0.5142],   // 허리 (속바지 위)
  [1.360, 0.8700],   // 어깨 (견장 위 0.866 · 깃 0.884)
  [1.485, 0.8800],   // 턱 (얼굴 구 아래) — 이 모델은 목이 짧아 어깨와 거의 붙는다
  [1.680, 1.1150],   // 눈 (홍채 가운데)
  [1.795, 1.4680],   // 머리끝 (경찰모 꼭대기)
];
const MODEL_H = 1.4655, HUMAN_H = 1.795;
const OUT_K = MODEL_H/HUMAN_H;          // 머리 위·발 아래의 여백은 부위가 없으니 전체 배수로 줄인다
function toModel(y){
  if (y <= 0) return y*OUT_K;
  const top = MARK[MARK.length-1];
  if (y >= top[0]) return top[1] + (y-top[0])*OUT_K;
  for (let i = 1; i < MARK.length; i++) {
    if (y > MARK[i][0]) continue;
    const [a0,a1] = MARK[i-1], [b0,b1] = MARK[i];
    return a1 + (y-a0)/(b0-a0)*(b1-a1);
  }
  return y*OUT_K;
}
/** 거리 칸 → 모델 좌표의 { 가운데, 담을 높이 } */
function frameOf(i){
  const f = DIST[i].f;
  const bot = toModel(f.c - f.h/2), top = toModel(f.c + f.h/2);
  return { mid:(bot+top)/2, h:Math.max(0.02, top-bot) };
}

// ── 마네킹 (발 0 · 머리끝 1.8 · +z 가 정면) ────────────────────────────────
/* ★기본으로 보이는 그림이다 (사용자 지시 2026-09-11). 사람 비율이라 거리 표(`FRAME`)를 그대로 쓴다 —
   `toModel()` 을 거치지 않는다. */
const B = [   // [시작, 끝, 굵기]
  [[0,0.90,0],[0,1.33,0],0.36],                    // 몸통 — 캡슐 위끝 1.51 (머리와 겹침)
  [[-0.195,1.36,0],[-0.300,0.75,0],0.115],         // 왼팔 — 몸통에서 조금 떼어 A 포즈
  [[ 0.195,1.36,0],[ 0.300,0.75,0],0.115],         // 오른팔
  [[-0.11,0.95,0],[-0.12,0.08,0],0.155],           // 왼다리
  [[ 0.11,0.95,0],[ 0.12,0.08,0],0.155],           // 오른다리
];
const HEAD = { c:[0,1.64,0], r:0.155 };
// ★앞뒤는 밝기가 아니라 **색**으로 가른다 (밝기로 하면 멀어서 어두운 건지 뒤라서 어두운 건지 헷갈린다)
const C_FRONT = "#7fb9f0", C_BACK = "#d98a5c";

// ── 상태 ───────────────────────────────────────────────────────────────────
const AZ_PINS = Array.from({length:16},(_,k)=> -0.875 + k*0.125);
let azIdx = AZ_PINS.indexOf(0), elIdx = 6, distIdx = 6, mul = 1;   // elIdx 는 EL 배열 인덱스
// 어느 그림을 보고 있었는지는 **기억한다** (사용자 지시 2026-09-11) — 창을 닫았다 열어도 그대로다.
// 방위·높이·거리는 기억하지 않는다: 그것은 이번에 만들 구도라 매번 정면·수평·전신에서 시작하는 편이 낫다.
const VIEW_KEY = "peropix.camera.view";
let mode = "doll";                                                 // "doll" 마네킹(기본) · "model" 입체 모델
try { if (localStorage.getItem(VIEW_KEY) === "model") mode = "model"; } catch (e) { /* 저장소를 막아 둔 환경 */ }

// ── 그림판 ─────────────────────────────────────────────────────────────────
const view = document.getElementById("view");
const cv = document.getElementById("cv"), hud = document.getElementById("hud");
const hctx = hud.getContext("2d");
const VW = 720, VH = 520;
const FOV = 30;                                  // 세로 화각 — 인물 사진에 가깝게 얕게 잡는다
const MARGIN = VH/(VH-40);                       // 위아래 20px 여백 (옛 그림판과 같은 여백)
const EL_LIMIT = Math.PI/2 - 0.001;              // 바로 위·아래에서 위 방향이 무너지지 않게

let renderer = null, scene = null, camera = null, model = null, loading = false;
const note = (s) => { document.getElementById("note").textContent = s; };

try {
  renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
  renderer.setClearColor(0x10141a, 1);
} catch (e) {
  renderer = null;     // 입체 모델 단추를 잠근다 — 마네킹은 2D 캔버스라 그대로 그려진다
}
if (!renderer) mode = "doll";   // 입체 모델로 두고 나갔더라도, 못 그리는 환경에서는 마네킹으로 연다
cv.style.display = mode === "model" ? "block" : "none";

if (renderer) {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(FOV, VW/VH, 0.02, 200);
  scene.add(camera);
  // ★빛을 **카메라에 붙인다** — 어느 방위로 돌아가도 인물이 읽힌다 (세계에 고정하면 뒤로 돌 때 새까매진다)
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(-0.5, 0.8, 1.0); camera.add(key);
  const fill = new THREE.DirectionalLight(0x9fc4ff, 0.8); fill.position.set(0.9, -0.2, 0.4); camera.add(fill);
  scene.add(new THREE.HemisphereLight(0xdce9ff, 0x252a33, 1.5));

  // 인물을 감싸는 고리 둘(가로·앞뒤 수직면)과 바닥 — 방위·높이를 눈으로 가늠하는 자리
  const ORB_Y = toModel(0.90), ORB_R = 0.90*OUT_K;
  const ring = (fn, color, opacity) => {
    const pts = Array.from({length:129},(_,k)=> fn(k/128*Math.PI*2));
    const g = new THREE.BufferGeometry().setFromPoints(pts);
    const line = new THREE.Line(g, new THREE.LineDashedMaterial({ color, transparent:true, opacity, dashSize:0.045, gapSize:0.055 }));
    line.computeLineDistances();
    scene.add(line);
  };
  ring((t)=> new THREE.Vector3(Math.sin(t)*ORB_R, ORB_Y, Math.cos(t)*ORB_R), 0x8cb4e1, 0.42);
  ring((t)=> new THREE.Vector3(0, ORB_Y + Math.sin(t)*ORB_R, Math.cos(t)*ORB_R), 0x8cb4e1, 0.30);
  ring((t)=> new THREE.Vector3(Math.cos(t)*ORB_R, 0, Math.sin(t)*ORB_R), 0x75b9ff, 0.22);

}

/** 입체 모델은 **처음 누를 때** 받는다 — 4MB 짜리 GLB 다 */
function ensureModel(){
  if (!renderer || model || loading) return;
  loading = true;
  note(T("모델을 불러오는 중…"));
  new GLTFLoader().load("./model/character.glb", (gltf) => {
    model = gltf.scene;
    scene.add(model);
    note("");
    draw();
  }, undefined, (err) => {
    loading = false;
    note(T("모델을 불러오지 못했습니다: {e}", { e: (err && err.message) ? err.message : err }));
  });
}

/* ★★**늘리는 것이 아니라 그 크기로 다시 그린다** (사용자 지적 2026-09-10: 창을 키우면 그림만 확대돼 이상하다).
   그리는 코드는 720×520 좌표계 그대로 두고, 화면에 놓인 실제 크기만큼 변환을 걸어 준다 — 어느 크기에서도 선이 또렷하다.
   `.stage` 가 비율을 지켜 주므로 찌그러지지 않는다. */
const stage = view.parentElement;   // `.stage` — 본문에서 남는 자리
function fit(){
  const dpr = Math.min(devicePixelRatio||1,2);
  const box = stage.getBoundingClientRect();
  const k = Math.max(0.2, Math.min(box.width/VW, box.height/VH));   // 그 자리에 들어가는 가장 큰 배수
  const w = Math.floor(VW*k), h = Math.floor(VH*k);
  view.style.width = w+"px"; view.style.height = h+"px";            // 비율 그대로, 넘치지 않게
  if (renderer) { renderer.setPixelRatio(dpr); renderer.setSize(w, h, false); }
  hud.width = Math.round(w*dpr); hud.height = Math.round(h*dpr);    // 그 크기로 **다시 그린다** (늘리는 게 아니다)
  hctx.setTransform(k*dpr,0,0,k*dpr,0,0);
}
/* ★자리(`.stage`)를 본다 — 캔버스를 보면 우리가 바꾼 크기에 스스로 반응해 맴돈다 */
new ResizeObserver(()=>{ fit(); draw(); }).observe(stage);
fit(); addEventListener("resize",()=>{ fit(); draw(); });

// 방위·높이·거리 → 카메라 자리. 담을 높이가 세로 화각에 꼭 차도록 거리를 정한다.
function place(){
  const fr = frameOf(distIdx);
  const th = AZ_PINS[azIdx]*Math.PI;
  const ph = Math.max(-EL_LIMIT, Math.min(EL_LIMIT, EL[elIdx].y*Math.PI/2));
  const d = (fr.h*MARGIN/2) / Math.tan(FOV*Math.PI/360);
  camera.position.set(d*Math.sin(th)*Math.cos(ph), fr.mid + d*Math.sin(ph), d*Math.cos(th)*Math.cos(ph));
  camera.up.set(0,1,0);
  camera.lookAt(0, fr.mid, 0);
  camera.near = Math.max(0.02, d - 3); camera.far = d + 6;
  camera.updateProjectionMatrix();
}

function draw(){
  if (mode === "model" && renderer && model) { place(); renderer.render(scene, camera); }
  hctx.clearRect(0,0,VW,VH);
  if (mode === "doll") drawDoll();      // 마네킹은 2D 캔버스에 직접 그린다 (입체 그림판은 숨어 있다)
  drawHud();
  sync();
}

// ── 마네킹 그리기 ──────────────────────────────────────────────────────────
/* 방위만큼 세계를 돌리고 높이만큼 기울인 뒤, 거리 칸이 담을 높이에 맞춰 배수를 정해 그린다.
   ★입체 모델과 달리 원근이 없다 — 구도를 가늠하는 그림이므로 부위 크기가 거리에 안 흔들리는 편이 낫다. */
function dollView(p){
  const th = AZ_PINS[azIdx]*Math.PI, ph = EL[elIdx].y*Math.PI/2;
  const x1 = p[0]*Math.cos(th) - p[2]*Math.sin(th);
  const z1 = p[0]*Math.sin(th) + p[2]*Math.cos(th);
  return { x:x1,
           y: p[1]*Math.cos(ph) - z1*Math.sin(ph),
           d: p[1]*Math.sin(ph) + z1*Math.cos(ph) };
}
function drawDoll(){
  const f = DIST[distIdx].f, scale = (VH-40)/f.h;
  const anchor = dollView([0,f.c,0]);                  // 프레임 중심을 화면 중앙에
  const S = (p) => { const v = dollView(p);
    return { x:VW/2 + v.x*scale, y:VH/2 - (v.y-anchor.y)*scale, d:v.d }; };

  const g = hctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,"#161c23"); g.addColorStop(1,"#11151a");
  hctx.fillStyle = g; hctx.fillRect(0,0,VW,VH);

  // 인물을 감싸는 고리 둘 — 가로(수평면)와 세로(앞뒤 수직면)
  const ORB_Y = 0.90, ORB_R = 0.90;
  const ringPts = (fn) => Array.from({length:97}, (_,k) => S(fn(k/96*Math.PI*2)));
  const HORZ = ringPts((t)=>[Math.sin(t)*ORB_R, ORB_Y, Math.cos(t)*ORB_R]);
  const VERT = ringPts((t)=>[0, ORB_Y + Math.sin(t)*ORB_R, Math.cos(t)*ORB_R]);
  function ringPass(pts, near, col, w) {
    hctx.strokeStyle = col; hctx.lineWidth = w; hctx.setLineDash([4,7]);
    hctx.beginPath();
    let pen = false;
    for (const q of pts) {
      const on = near ? q.d >= 0 : q.d < 0;
      if (on) { pen ? hctx.lineTo(q.x,q.y) : hctx.moveTo(q.x,q.y); pen = true; }
      else pen = false;
    }
    hctx.stroke(); hctx.setLineDash([]);
  }
  ringPass(HORZ, false, "rgba(140,180,225,.30)", 1.3);
  ringPass(VERT, false, "rgba(140,180,225,.22)", 1.3);

  // 바닥
  hctx.beginPath();
  for (let k=0;k<=64;k++){ const t=k/64*Math.PI*2;
    const q=S([Math.cos(t)*ORB_R,0,Math.sin(t)*ORB_R]); k?hctx.lineTo(q.x,q.y):hctx.moveTo(q.x,q.y); }
  hctx.closePath(); hctx.strokeStyle="rgba(117,185,255,.16)"; hctx.lineWidth=1.2;
  hctx.setLineDash([5,7]); hctx.stroke(); hctx.setLineDash([]);

  const f0 = dollView([0,0,0]), f1 = dollView([0,0,1]);
  const FWD = { sx:f1.x-f0.x, sy:-(f1.y-f0.y), d:f1.d-f0.d };

  const clipHalf = (px,py,nx,ny) => {
    const L = 4000, ex = -ny*L, ey = nx*L;
    hctx.beginPath();
    hctx.moveTo(px+ex, py+ey);           hctx.lineTo(px-ex, py-ey);
    hctx.lineTo(px-ex+nx*L, py-ey+ny*L); hctx.lineTo(px+ex+nx*L, py+ey+ny*L);
    hctx.closePath(); hctx.clip();
  };
  const splitT = (fn) => {
    const m = Math.hypot(fn, FWD.d) || 1;
    return Math.max(-1, Math.min(1, -FWD.d/m));
  };

  const hr = HEAD.r*scale;
  const H = S(HEAD.c);
  const items = B.map(([a,b,w])=>{ const A=S(a),C=S(b); return {t:"limb",A,C,w,d:(A.d+C.d)/2}; });
  items.push({ t:"head", d:H.d });
  items.sort((m,n)=>m.d-n.d);

  for (const it of items) {
    if (it.t === "limb") {
      const half = it.w*scale/2;
      let ux = it.C.x-it.A.x, uy = it.C.y-it.A.y;
      const ul = Math.hypot(ux,uy);
      let nx, ny, fn;
      if (ul < half) {
        const hl = Math.hypot(FWD.sx, FWD.sy);
        if (hl < 1e-6) { nx = 1; ny = 0; fn = 0; }
        else { nx = FWD.sx/hl; ny = FWD.sy/hl; fn = hl; }
      } else {
        ux/=ul; uy/=ul; nx = -uy; ny = ux; fn = FWD.sx*nx + FWD.sy*ny;
        if (fn < 0) { nx=-nx; ny=-ny; fn=-fn; }
      }
      const t = splitT(fn);
      const line = () => { hctx.beginPath(); hctx.moveTo(it.A.x,it.A.y); hctx.lineTo(it.C.x,it.C.y); hctx.stroke(); };
      hctx.lineWidth = it.w*scale; hctx.lineCap = "round";
      if (t <= -0.999) { hctx.strokeStyle = C_FRONT; line(); continue; }
      hctx.strokeStyle = C_BACK; line();
      if (t < 1) { hctx.save(); clipHalf(it.A.x+nx*t*half, it.A.y+ny*t*half, nx, ny);
                   hctx.strokeStyle = C_FRONT; line(); hctx.restore(); }
      continue;
    }
    const hl = Math.hypot(FWD.sx, FWD.sy);
    const circle = () => { hctx.beginPath(); hctx.arc(H.x,H.y,hr,0,Math.PI*2); hctx.fill(); };
    const ht = hl < 1e-6 ? (FWD.d > 0 ? -1 : 1) : splitT(hl);
    if (ht <= -0.999) { hctx.fillStyle = C_FRONT; circle(); }
    else {
      hctx.fillStyle = C_BACK; circle();
      if (ht < 1 && hl >= 1e-6) {
        const nx = FWD.sx/hl, ny = FWD.sy/hl;
        hctx.save(); clipHalf(H.x+nx*ht*hr, H.y+ny*ht*hr, nx, ny);
        hctx.fillStyle = C_FRONT; circle(); hctx.restore();
      }
    }
    if (FWD.d > 0) {
      hctx.fillStyle = "#14202a";
      for (const sx of [-0.40,0.40]) {
        const e = S([sx*HEAD.r, HEAD.c[1]+0.03, HEAD.r*0.88]);
        hctx.beginPath(); hctx.arc(e.x, e.y, Math.max(1.3,hr*.14), 0, Math.PI*2); hctx.fill();
      }
    }
  }

  ringPass(HORZ, true, "rgba(160,200,240,.42)", 1.4);
  ringPass(VERT, true, "rgba(160,200,240,.30)", 1.4);
}

// 거리 눈금 — 휠이 바꾸는 값. 그림 위에 겹쳐 그린다.
function drawHud(){
  hctx.strokeStyle="rgba(232,238,245,.10)"; hctx.lineWidth=1;
  hctx.strokeRect(14.5,14.5,VW-29,VH-29);

  const gx = VW-42, gyT = 96, gyB = 424;
  const at = (i) => gyT + i/(DIST.length-1)*(gyB-gyT);
  hctx.strokeStyle = "rgba(232,238,245,.20)"; hctx.lineWidth = 1;
  hctx.beginPath(); hctx.moveTo(gx, gyT); hctx.lineTo(gx, gyB); hctx.stroke();
  hctx.textAlign = "right";
  for (let i = 0; i < DIST.length; i++) {
    const named = !DIST[i].mix;
    hctx.strokeStyle = named ? "rgba(232,238,245,.40)" : "rgba(232,238,245,.20)";
    hctx.lineWidth = named ? 1.6 : 1;
    hctx.beginPath(); hctx.moveTo(gx-(named?12:6), at(i)); hctx.lineTo(gx, at(i)); hctx.stroke();
    if (named) {
      hctx.fillStyle = i === distIdx ? "#e8eef5" : "rgba(232,238,245,.36)";
      hctx.font = (i === distIdx ? "600 " : "") + "10px system-ui,sans-serif";
      hctx.fillText(distName(DIST[i]), gx-16, at(i)+3);
    }
  }
  hctx.fillStyle = "rgba(232,238,245,.34)"; hctx.font = "10px system-ui,sans-serif";
  hctx.fillText(T("거리"), gx+4, gyT-13);
  hctx.fillStyle = "#7fb9f0";
  hctx.beginPath(); hctx.arc(gx, at(distIdx), 5.5, 0, Math.PI*2); hctx.fill();
}

// ── 출력 ───────────────────────────────────────────────────────────────────
function promptTags(){
  const x = AZ_PINS[azIdx], e = EL[elIdx], d = DIST[distIdx];
  // ★가중치 1.00 은 안 적는다 — `1.00::tag::` 와 `tag` 는 NAI 에서 같은 것이다
  const parts = [];
  const wt = (w, tag) => { const v = (w*mul).toFixed(2); return v === "1.00" ? tag : `${v}::${tag}::`; };
  for (const t of azTags(x)) parts.push(wt(t.w, t.tag));
  if (e.tag) for (const t of e.tag.split(",")) parts.push(wt(e.w, t.trim()));
  for (const t of d.tags) parts.push(wt(1, t));
  return parts;
}
function sync(){
  const x = AZ_PINS[azIdx], e = EL[elIdx], d = DIST[distIdx];
  const parts = promptTags();
  document.getElementById("out").textContent = parts.join(", ") + (parts.length?",":"");
  const deg = Math.round(x*180);
  document.getElementById("vAz").textContent =
    Math.abs(deg)===180 ? T("후면") : deg===0 ? T("정면") : T(deg>0?"오른쪽 {d}°":"왼쪽 {d}°", { d: Math.abs(deg) });
  document.getElementById("vEl").textContent = T(e.kr);
  document.getElementById("vDist").textContent = distName(d);
}

// ── 조작 ───────────────────────────────────────────────────────────────────
let drag = null;
view.addEventListener("pointerdown",(ev)=>{ view.setPointerCapture(ev.pointerId);
  drag = { x:ev.clientX, y:ev.clientY, az:azIdx, el:elIdx, id:ev.pointerId }; });
view.addEventListener("pointermove",(ev)=>{
  if (!drag || drag.id !== ev.pointerId) return;
  // 인물을 손으로 잡아 돌리는 감각 — 끄는 방향으로 인물이 돌아간다
  const stepX = Math.round((ev.clientX-drag.x)/26), stepY = Math.round((ev.clientY-drag.y)/34);
  azIdx = ((drag.az - stepX) % 16 + 16) % 16;
  elIdx = Math.max(0, Math.min(EL.length-1, drag.el - stepY));
  draw();
});
const stop = () => drag = null;
view.addEventListener("pointerup",stop); view.addEventListener("pointercancel",stop);
view.addEventListener("wheel",(ev)=>{ ev.preventDefault();
  const dv = ev.deltaY !== 0 ? ev.deltaY : ev.deltaX;
  if (dv === 0) return;
  distIdx = Math.max(0, Math.min(DIST.length-1, distIdx + (dv>0?1:-1)));   // 휠은 거리만
  draw();
},{passive:false});
addEventListener("keydown",(ev)=>{
  if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  const k = ev.key;
  if (k==="ArrowLeft") azIdx = (azIdx+15)%16;
  else if (k==="ArrowRight") azIdx = (azIdx+1)%16;
  else if (k==="ArrowUp") elIdx = Math.max(0, elIdx-1);
  else if (k==="ArrowDown") elIdx = Math.min(EL.length-1, elIdx+1);
  else if (k==="Home") { azIdx = AZ_PINS.indexOf(0); elIdx = 6; distIdx = 6; }
  else return;
  ev.preventDefault(); draw();
});
// ── 그림 고르기 — 마네킹(기본) ↔ 입체 모델 (사용자 지시 2026-09-11) ────────
// 단추에는 **누르면 무엇이 되는지**를 적는다 (앱의 켜기·끄기 단추와 같은 방식이다).
const btnMode = document.getElementById("btnMode");
const legend = document.getElementById("legend");
btnMode.disabled = !renderer;
if (!renderer) btnMode.title = T("이 환경에서는 입체 모델을 띄울 수 없습니다 (WebGL 없음).");
function setMode(m){
  mode = m;
  try { localStorage.setItem(VIEW_KEY, m); } catch (e) { /* 저장소를 막아 둔 환경 */ }
  cv.style.display = m === "model" ? "block" : "none";
  legend.hidden = m === "model";                 // 앞·뒤 색 안내는 마네킹에만 해당한다
  if (m === "model") ensureModel(); else note("");
  relabel();
  draw();
}
btnMode.onclick = () => setMode(mode === "model" ? "doll" : "model");

const mulN = document.getElementById("mulN");
mulN.oninput = () => {
  const v = Number(mulN.value);
  if (Number.isFinite(v) && v > 0) { mul = v; sync(); }
};

// ── 앱에 넣기 · 복사 ────────────────────────────────────────────────────────
// ★★이름표는 **`<플러그인>_<블록>`** 꼴이다 (사용자 지시 2026-09-11): 사용자가 손으로 만든 블록과 겹치지 않고,
//   넣기가 **내 블록만** 골라 지울 수 있다. 언어를 바꾸면 이름표도 바뀌므로, 넣기 전에 **다른 언어로 넣어 둔 것까지**
//   걷어 낸다 (`cameraPrefixes()` 가 세 언어의 접두어를 준다).
const btnPut = document.getElementById("btnPut");
btnPut.disabled = !inApp;
/** 지금 씬의 스타일 카드에서 내가 넣었던 블록을 지운다 — `peropix.scene()` 은 화면에 살아 있는 상태다 */
async function clearMine(){
  if (!peropix.scene) return;
  const sc = await peropix.scene().catch(() => null);
  const pre = cameraPrefixes();
  for (const b of ((sc && sc.base) || [])) {
    const L = String((b && b.label) || "");
    if (L !== cameraBlockLabel() && pre.some((x) => L.indexOf(x) === 0))
      await peropix.call({ call: "action", name: "edit_style_card", args: { label: L, tags: "", mode: "remove", block: b.id } });
  }
}
btnPut.onclick = async () => {
  const tags = promptTags().join(", ");
  const LABEL = cameraBlockLabel();
  btnPut.disabled = true; note(T("넣는 중…"));
  try {
    await clearMine();
    // 같은 이름의 블록이 하나 있으면 갈아 끼우고, 없으면 새로 붙인다 (여럿이면 앱이 되묻는 대신 새로 붙인다)
    let r = await peropix.call({ call: "action", name: "edit_style_card", args: { label: LABEL, tags, mode: "replace", block: "" } });
    const failed = !r.ok || (r.result && r.result.error);
    if (failed) r = await peropix.call({ call: "action", name: "edit_style_card", args: { label: LABEL, tags, mode: "add" } });
    if (!r.ok) note(T("앱이 거절했습니다: {e}", { e: r.error }));
    else if (r.result && r.result.error) note(T("앱이 거절했습니다: {e}", { e: r.result.error.message || JSON.stringify(r.result.error) }));
    else { note((r.result && r.result.did) || T("넣었습니다.")); peropix.toast(T("카메라 구도를 스타일 카드에 넣었습니다")); }
  } finally { btnPut.disabled = false; }
};
document.getElementById("btnCopy").onclick = async () => {
  const s = promptTags().join(", ") + ",";
  try { await navigator.clipboard.writeText(s); note(T("복사했습니다.")); }
  catch { const ta = document.createElement("textarea"); ta.value = s; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); note(T("복사했습니다.")); }
};

// ── 앱 언어를 따라간다 (사용자 결정 2026-09-11 「공식 플러그인은 세 언어를 기본으로」) ──────────
// 정적 문구는 `data-t` 표식이 달린 자리를 사전이 갈아 끼우고, 그린 것(상태 줄·눈금)은 여기서 다시 그린다.
function relabel(){
  btnMode.textContent = T(mode === "model" ? "마네킹으로" : "입체 모델로");
  if (!renderer) btnMode.title = T("이 환경에서는 입체 모델을 띄울 수 없습니다 (WebGL 없음).");
  document.getElementById("hint").textContent =
    T("드래그로 둘러보기 · 휠로 거리. 넣기는 스타일 카드의 「{label}」 블록을 갈아 끼웁니다.", { label: cameraBlockLabel() });
  sync(); drawHud();
}
(async () => {
  let l = "ko";
  try { l = await peropix.locale(); } catch (e) { l = (navigator.language || "ko").slice(0, 2); }
  setCameraLang(l); relabel();
  if (peropix.onLocale) peropix.onLocale((x) => { setCameraLang(x); relabel(); });
})();
setMode(mode);    // 지난번에 보던 그림으로 연다 (기억한 값이 「입체 모델」이면 여기서 받는다)
</script>
</body>
</html>
